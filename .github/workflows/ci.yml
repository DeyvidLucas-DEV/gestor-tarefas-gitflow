name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Validação: --error faz o job falhar se houver qualquer achado.
      - name: Analisar o código-fonte
        run: >
          semgrep scan
          --config p/python --config p/security-audit --config p/secrets
          --error --metrics=off
          --sarif-output=semgrep.sarif
      - name: Enviar achados para a aba Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  testes:
    name: Testes (Python ${{ matrix.python-version }})
    needs: [lint, sast]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=src --cov-report=term-missing

  dast:
    name: DAST (OWASP ZAP)
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Subir a API
        run: |
          HOST=0.0.0.0 PYTHONPATH=src nohup python -m gestor_tarefas.api > api.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/ && exit 0; sleep 1; done
          cat api.log; exit 1
      # Validação: o ZAP ataca as rotas descritas no OpenAPI e o job falha
      # se houver qualquer alerta de nível WARN ou FAIL.
      - name: Atacar a API em execução
        run: |
          mkdir -p zap && cp .zap/openapi.yaml zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi \
            -r relatorio-zap.html -J relatorio-zap.json
      - name: Guardar o relatório do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dast
          path: zap/relatorio-zap.*

  release:
    name: Publicar release
    needs: dast
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
