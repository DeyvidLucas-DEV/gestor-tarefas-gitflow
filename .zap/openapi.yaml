# Contrato da API usado pelo OWASP ZAP para saber quais rotas atacar no DAST.
openapi: 3.0.3
info:
  title: Gestor de Tarefas
  version: "1.1.0"
servers:
  - url: http://localhost:8000
paths:
  /:
    get:
      summary: Informações da aplicação
      responses:
        "200":
          description: Nome e versão
  /tarefas:
    get:
      summary: Lista as tarefas
      responses:
        "200":
          description: Lista de tarefas
    post:
      summary: Cria uma tarefa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo]
              properties:
                titulo:
                  type: string
                  example: Estudar DevSecOps
      responses:
        "201":
          description: Tarefa criada
        "400":
          description: Título inválido
  /tarefas/{id}:
    get:
      summary: Busca uma tarefa
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Tarefa encontrada
        "404":
          description: Tarefa não encontrada
